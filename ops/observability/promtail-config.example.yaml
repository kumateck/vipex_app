server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: ${LOKI_PUSH_URL}
    basic_auth:
      username: ${LOKI_USERNAME}
      password: ${LOKI_PASSWORD}

scrape_configs:
  - job_name: vipex-api
    static_configs:
      - targets:
          - localhost
        labels:
          job: vipex-api
          __path__: /var/log/vipex/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: msg
            environment: environment
            service: service
            method: method
            path: path
            status: status
            rid: rid
      - labels:
          level:
          environment:
          service:
      - output:
          source: message
