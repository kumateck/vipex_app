name: Mobile Build (Android Only) (Internal)

on:
  push:
    branches:
      - mobile

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      DEPLOY_MINIO_ENDPOINT: ${{ secrets.DEPLOY_MINIO_ENDPOINT }}
      MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
      MINIO_REGION: ${{ secrets.MINIO_REGION }}
      MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
      MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
      MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
      MOBILE_MINIO_PREFIX: mobile/android
      MOBILE_RELEASE_VERSION: 1.0.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Remove non-Bun lockfiles
        run: |
          rm -f package-lock.json pnpm-lock.yaml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Sync Brand Assets
        run: bun run assets:sync

      - name: Resolve Mobile Version
        id: mobile_version
        run: |
          echo "version=${MOBILE_RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Apply Android Release Version
        run: |
          bun run scripts/set-mobile-android-version.ts \
            "${{ steps.mobile_version.outputs.version }}" \
            "${{ steps.mobile_version.outputs.version_code }}"

      - name: Setup Java (Native Android Build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Native Android Project
        run: |
          set -euo pipefail
          if [ ! -f apps/mobile/android/gradlew ]; then
            echo "Native mode requires the tracked apps/mobile/android project."
            exit 1
          fi

      - name: Build APK with Gradle
        working-directory: apps/mobile/android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Collect APK from Native Build
        run: |
          set -euo pipefail
          mkdir -p artifacts
          mapfile -t APK_FILES < <(find apps/mobile/android/app/build/outputs/apk -type f -name "*.apk")
          if [ "${#APK_FILES[@]}" -ne 1 ]; then
            echo "Expected one release APK, found ${#APK_FILES[@]}."
            exit 1
          fi
          cp "${APK_FILES[0]}" artifacts/vipex-mobile-android.apk
          ls -lah artifacts

      - name: Create Android Update Manifest
        env:
          VERSION: ${{ steps.mobile_version.outputs.version }}
          VERSION_CODE: ${{ steps.mobile_version.outputs.version_code }}
        run: |
          set -euo pipefail
          SHA256=$(sha256sum artifacts/vipex-mobile-android.apk | cut -d ' ' -f 1)
          PUBLISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          SHA256="$SHA256" PUBLISHED_AT="$PUBLISHED_AT" node -e "const fs=require('node:fs');fs.writeFileSync('artifacts/latest.json',JSON.stringify({version:process.env.VERSION,versionCode:Number(process.env.VERSION_CODE),fileName:'vipex-mobile-android.apk',releaseNotes:'Latest Vipex Mobile improvements and fixes.',publishedAt:process.env.PUBLISHED_AT,sha256:process.env.SHA256},null,2)+'\n')"

      - name: Validate MinIO Release Configuration
        run: |
          set -euo pipefail
          UPLOAD_MINIO_ENDPOINT="${DEPLOY_MINIO_ENDPOINT:-${MINIO_ENDPOINT}}"
          : "${UPLOAD_MINIO_ENDPOINT:?DEPLOY_MINIO_ENDPOINT (or MINIO_ENDPOINT fallback) secret is required}"
          : "${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY secret is required}"
          : "${MINIO_SECRET_KEY:?MINIO_SECRET_KEY secret is required}"
          : "${MINIO_BUCKET:?MINIO_BUCKET secret is required}"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vipex-mobile-android-apk-${{ github.event.pull_request.number || github.run_number }}
          path: |
            artifacts/*.apk
            artifacts/latest.json
          if-no-files-found: error
          retention-days: 14

      - name: Configure AWS CLI for MinIO
        run: |
          mkdir -p ~/.aws
          cat <<EOF > ~/.aws/credentials
          [default]
          aws_access_key_id=${MINIO_ACCESS_KEY}
          aws_secret_access_key=${MINIO_SECRET_KEY}
          EOF
          cat <<EOF > ~/.aws/config
          [default]
          region=${MINIO_REGION:-us-east-1}
          output=json
          EOF

      - name: Publish APK and Update Manifest to MinIO
        env:
          VERSION: ${{ steps.mobile_version.outputs.version }}
        run: |
          set -euo pipefail
          UPLOAD_MINIO_ENDPOINT="${DEPLOY_MINIO_ENDPOINT:-${MINIO_ENDPOINT}}"
          PREFIX="${MOBILE_MINIO_PREFIX:-mobile/android}"
          LATEST_PREFIX="${PREFIX}/latest"
          VERSION_PREFIX="${PREFIX}/v${VERSION}"

          mapfile -t APK_FILES < <(find artifacts -maxdepth 1 -type f -name "*.apk")
          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "No APK files found in artifacts/"
            exit 1
          fi

          for file in "${APK_FILES[@]}"; do
            base=$(basename "${file}")
            aws --endpoint-url "${UPLOAD_MINIO_ENDPOINT}" s3api put-object \
              --bucket "${MINIO_BUCKET}" \
              --key "${LATEST_PREFIX}/${base}" \
              --content-type "application/vnd.android.package-archive" \
              --cache-control "no-store" \
              --body "${file}" >/dev/null

            aws --endpoint-url "${UPLOAD_MINIO_ENDPOINT}" s3api put-object \
              --bucket "${MINIO_BUCKET}" \
              --key "${VERSION_PREFIX}/${base}" \
              --content-type "application/vnd.android.package-archive" \
              --cache-control "public, max-age=31536000, immutable" \
              --body "${file}" >/dev/null
          done

          aws --endpoint-url "${UPLOAD_MINIO_ENDPOINT}" s3api put-object \
            --bucket "${MINIO_BUCKET}" \
            --key "${LATEST_PREFIX}/latest.json" \
            --content-type "application/json" \
            --cache-control "no-store" \
            --body artifacts/latest.json >/dev/null

          aws --endpoint-url "${UPLOAD_MINIO_ENDPOINT}" s3api put-object \
            --bucket "${MINIO_BUCKET}" \
            --key "${VERSION_PREFIX}/latest.json" \
            --content-type "application/json" \
            --body artifacts/latest.json >/dev/null

      - name: Distribution summary
        run: |
          echo "Native Gradle APK build completed."
          echo "Release: ${{ steps.mobile_version.outputs.version }} (${{ steps.mobile_version.outputs.version_code }})"
          echo "APK artifact uploaded to GitHub artifacts."
          PREFIX="${MOBILE_MINIO_PREFIX:-mobile/android}"
          UPLOAD_MINIO_ENDPOINT="${DEPLOY_MINIO_ENDPOINT:-${MINIO_ENDPOINT}}"
          echo "MinIO release base: ${UPLOAD_MINIO_ENDPOINT%/}/${MINIO_BUCKET}/${PREFIX}/"

  build-ios:
    if: ${{ false }} # Paused for now; keep config for quick re-enable
    name: Build iOS Artifact
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      DEPLOY_MINIO_ENDPOINT: ${{ secrets.DEPLOY_MINIO_ENDPOINT }}
      MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
      MINIO_REGION: ${{ secrets.MINIO_REGION }}
      MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
      MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
      MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
      MOBILE_MINIO_PREFIX: mobile/ios

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Remove non-Bun lockfiles for EAS
        run: |
          rm -f package-lock.json pnpm-lock.yaml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Sync Brand Assets
        run: bun run assets:sync

      - name: Verify Expo Token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is missing. Add it in GitHub repo secrets."
            exit 1
          fi

      - name: Resolve Mobile Version
        id: mobile_version
        run: |
          VERSION=$(node -p "require('./apps/mobile/app.json').expo.version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate EAS project id
        run: |
          set -euo pipefail
          PROJECT_ID=$(node -p "require('./apps/mobile/app.json').expo?.extra?.eas?.projectId || ''")
          if [ -z "$PROJECT_ID" ] || [ "$PROJECT_ID" = "REPLACE_WITH_EAS_PROJECT_ID" ]; then
            echo "apps/mobile/app.json expo.extra.eas.projectId must be set to a real EAS project id."
            exit 1
          fi

      - name: Trigger and Wait for EAS iOS Build
        id: eas_build
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          bunx eas-cli whoami
          bunx eas-cli build --platform ios --profile preview --non-interactive --wait --json > eas-build-ios.json
          cat eas-build-ios.json

          BUILD_URL=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('eas-build-ios.json','utf8'));const item=Array.isArray(j)?j[0]:j;console.log(item?.artifacts?.buildUrl||'')")
          BUILD_ID=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('eas-build-ios.json','utf8'));const item=Array.isArray(j)?j[0]:j;console.log(item?.id||'')")

          if [ -z "$BUILD_URL" ]; then
            echo "Could not resolve iOS build URL from EAS output"
            exit 1
          fi

          echo "build_url=$BUILD_URL" >> "$GITHUB_OUTPUT"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Download iOS Artifact
        run: |
          mkdir -p artifacts
          ARTIFACT_URL="${{ steps.eas_build.outputs.build_url }}"
          FILE_NAME=$(basename "${ARTIFACT_URL%%\?*}")
          if [ -z "${FILE_NAME}" ] || [ "${FILE_NAME}" = "/" ] || [ "${FILE_NAME}" = "." ]; then
            FILE_NAME="vipex-mobile-ios-${{ github.run_number }}.bin"
          fi
          curl -L "${ARTIFACT_URL}" -o "artifacts/${FILE_NAME}"
          ls -lah artifacts

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vipex-mobile-ios-${{ github.event.pull_request.number || github.run_number }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Configure AWS CLI for MinIO
        if: ${{ (env.DEPLOY_MINIO_ENDPOINT != '' || env.MINIO_ENDPOINT != '') && env.MINIO_ACCESS_KEY != '' && env.MINIO_SECRET_KEY != '' && env.MINIO_BUCKET != '' }}
        run: |
          mkdir -p ~/.aws
          cat <<EOF > ~/.aws/credentials
          [default]
          aws_access_key_id=${MINIO_ACCESS_KEY}
          aws_secret_access_key=${MINIO_SECRET_KEY}
          EOF
          cat <<EOF > ~/.aws/config
          [default]
          region=${MINIO_REGION:-us-east-1}
          output=json
          EOF

      - name: Mirror iOS artifact to MinIO (optional)
        if: ${{ (env.DEPLOY_MINIO_ENDPOINT != '' || env.MINIO_ENDPOINT != '') && env.MINIO_ACCESS_KEY != '' && env.MINIO_SECRET_KEY != '' && env.MINIO_BUCKET != '' }}
        env:
          VERSION: ${{ steps.mobile_version.outputs.version }}
        run: |
          set -euo pipefail
          UPLOAD_MINIO_ENDPOINT="${DEPLOY_MINIO_ENDPOINT:-${MINIO_ENDPOINT}}"
          PREFIX="${MOBILE_MINIO_PREFIX:-mobile/ios}"
          LATEST_PREFIX="${PREFIX}/latest"
          VERSION_PREFIX="${PREFIX}/v${VERSION}"

          mapfile -t FILES < <(find artifacts -maxdepth 1 -type f)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No iOS artifacts found in artifacts/"
            exit 1
          fi

          for file in "${FILES[@]}"; do
            base=$(basename "${file}")
            aws --endpoint-url "${UPLOAD_MINIO_ENDPOINT}" s3api put-object \
              --bucket "${MINIO_BUCKET}" \
              --key "${LATEST_PREFIX}/${base}" \
              --body "${file}" >/dev/null

            aws --endpoint-url "${UPLOAD_MINIO_ENDPOINT}" s3api put-object \
              --bucket "${MINIO_BUCKET}" \
              --key "${VERSION_PREFIX}/${base}" \
              --body "${file}" >/dev/null
          done

      - name: Distribution summary
        run: |
          echo "iOS artifact uploaded to GitHub artifacts."
          if [ -n "${DEPLOY_MINIO_ENDPOINT:-${MINIO_ENDPOINT}}" ] && [ -n "${MINIO_BUCKET}" ]; then
            PREFIX="${MOBILE_MINIO_PREFIX:-mobile/ios}"
            UPLOAD_MINIO_ENDPOINT="${DEPLOY_MINIO_ENDPOINT:-${MINIO_ENDPOINT}}"
            echo "MinIO mirror base: ${UPLOAD_MINIO_ENDPOINT%/}/${MINIO_BUCKET}/${PREFIX}/"
          fi
