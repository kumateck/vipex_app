name: Deploy Testing

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-testing
  cancel-in-progress: true

env:
  IMAGE_TAG: testing-latest

jobs:
  validate:
    name: Validate Testing Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: testing
    env:
      NODE_ENV: production
      APP_BASE_URL: ${{ secrets.TEST_APP_BASE_URL }}
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      EMAIL_PASSWORD: ${{ secrets.TEST_EMAIL_PASSWORD }}
      EMAIL_USER: ${{ secrets.TEST_EMAIL_USER }}
      JWT_ACCESS_EXPIRES: ${{ secrets.TEST_JWT_ACCESS_EXPIRES }}
      JWT_REFRESH_EXPIRES: ${{ secrets.TEST_JWT_REFRESH_EXPIRES }}
      JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}
      MINIO_REGION: ${{ secrets.TEST_MINIO_REGION }}
      PASSWORD_COST: ${{ secrets.TEST_PASSWORD_COST }}
      PORT: ${{ secrets.TEST_PORT }}
      SENTRY_DSN: ${{ secrets.TEST_SENTRY_DSN }}
      SMTP_FROM: ${{ secrets.TEST_SMTP_FROM }}
      SMTP_HOST: ${{ secrets.TEST_SMTP_HOST }}
      SMTP_PASS: ${{ secrets.TEST_SMTP_PASS }}
      SMTP_PORT: ${{ secrets.TEST_SMTP_PORT }}
      SMTP_SECURE: ${{ secrets.TEST_SMTP_SECURE }}
      SMTP_USER: ${{ secrets.TEST_SMTP_USER }}
      SWAGGER_ENABLED: ${{ secrets.TEST_SWAGGER_ENABLED }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test:ci

      - name: Run integration tests
        run: bun run test:server

      - name: Build application
        run: bun run build

  build-and-push:
    name: Build and Push Testing Image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: validate
    environment: testing
    env:
      NODE_ENV: production
      APP_BASE_URL: ${{ secrets.TEST_APP_BASE_URL }}
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      EMAIL_PASSWORD: ${{ secrets.TEST_EMAIL_PASSWORD }}
      EMAIL_USER: ${{ secrets.TEST_EMAIL_USER }}
      JWT_ACCESS_EXPIRES: ${{ secrets.TEST_JWT_ACCESS_EXPIRES }}
      JWT_REFRESH_EXPIRES: ${{ secrets.TEST_JWT_REFRESH_EXPIRES }}
      JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}
      MINIO_REGION: ${{ secrets.TEST_MINIO_REGION }}
      PASSWORD_COST: ${{ secrets.TEST_PASSWORD_COST }}
      PORT: ${{ secrets.TEST_PORT }}
      SENTRY_DSN: ${{ secrets.TEST_SENTRY_DSN }}
      SMTP_FROM: ${{ secrets.TEST_SMTP_FROM }}
      SMTP_HOST: ${{ secrets.TEST_SMTP_HOST }}
      SMTP_PASS: ${{ secrets.TEST_SMTP_PASS }}
      SMTP_PORT: ${{ secrets.TEST_SMTP_PORT }}
      SMTP_SECURE: ${{ secrets.TEST_SMTP_SECURE }}
      SMTP_USER: ${{ secrets.TEST_SMTP_USER }}
      SWAGGER_ENABLED: ${{ secrets.TEST_SWAGGER_ENABLED }}
    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.TEST_REGISTRY }}
          username: ${{ secrets.TEST_REGISTRY_USERNAME }}
          password: ${{ secrets.TEST_REGISTRY_PASSWORD }}

      - name: Compose image reference
        id: image
        run: |
          IMAGE_REF="${{ secrets.TEST_REGISTRY }}/${{ secrets.TEST_IMAGE_NAME }}:${IMAGE_TAG}"
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${IMAGE_REF}"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image.outputs.image_ref }}

  deploy:
    name: Deploy to Testing Server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-and-push
    environment: testing
    env:
      NODE_ENV: production
      APP_BASE_URL: ${{ secrets.TEST_APP_BASE_URL }}
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      EMAIL_PASSWORD: ${{ secrets.TEST_EMAIL_PASSWORD }}
      EMAIL_USER: ${{ secrets.TEST_EMAIL_USER }}
      JWT_ACCESS_EXPIRES: ${{ secrets.TEST_JWT_ACCESS_EXPIRES }}
      JWT_REFRESH_EXPIRES: ${{ secrets.TEST_JWT_REFRESH_EXPIRES }}
      JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}
      MINIO_REGION: ${{ secrets.TEST_MINIO_REGION }}
      PASSWORD_COST: ${{ secrets.TEST_PASSWORD_COST }}
      PORT: ${{ secrets.TEST_PORT }}
      SENTRY_DSN: ${{ secrets.TEST_SENTRY_DSN }}
      SMTP_FROM: ${{ secrets.TEST_SMTP_FROM }}
      SMTP_HOST: ${{ secrets.TEST_SMTP_HOST }}
      SMTP_PASS: ${{ secrets.TEST_SMTP_PASS }}
      SMTP_PORT: ${{ secrets.TEST_SMTP_PORT }}
      SMTP_SECURE: ${{ secrets.TEST_SMTP_SECURE }}
      SMTP_USER: ${{ secrets.TEST_SMTP_USER }}
      SWAGGER_ENABLED: ${{ secrets.TEST_SWAGGER_ENABLED }}

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.TEST_SSH_HOST }}
          username: ${{ secrets.TEST_SSH_USER }}
          key: ${{ secrets.TEST_SSH_KEY }}
          port: ${{ secrets.TEST_SSH_PORT || 22 }}
          script_stop: true
          envs: NODE_ENV,APP_BASE_URL,DATABASE_URL,EMAIL_PASSWORD,EMAIL_USER,JWT_ACCESS_EXPIRES,JWT_REFRESH_EXPIRES,JWT_SECRET,MINIO_REGION,PASSWORD_COST,PORT,SENTRY_DSN,SMTP_FROM,SMTP_HOST,SMTP_PASS,SMTP_PORT,SMTP_SECURE,SMTP_USER,SWAGGER_ENABLED
          script: |
            set -euo pipefail
            IMAGE_REF="${{ needs.build-and-push.outputs.image_ref }}"
            REMOTE_ENV_FILE="/tmp/vipex-testing.env"
            cat > "${REMOTE_ENV_FILE}" <<EOF
            NODE_ENV=${NODE_ENV}
            APP_BASE_URL=${APP_BASE_URL}
            DATABASE_URL=${DATABASE_URL}
            EMAIL_PASSWORD=${EMAIL_PASSWORD}
            EMAIL_USER=${EMAIL_USER}
            JWT_ACCESS_EXPIRES=${JWT_ACCESS_EXPIRES}
            JWT_REFRESH_EXPIRES=${JWT_REFRESH_EXPIRES}
            JWT_SECRET=${JWT_SECRET}
            MINIO_REGION=${MINIO_REGION}
            PASSWORD_COST=${PASSWORD_COST}
            PORT=${PORT}
            SENTRY_DSN=${SENTRY_DSN}
            SMTP_FROM=${SMTP_FROM}
            SMTP_HOST=${SMTP_HOST}
            SMTP_PASS=${SMTP_PASS}
            SMTP_PORT=${SMTP_PORT}
            SMTP_SECURE=${SMTP_SECURE}
            SMTP_USER=${SMTP_USER}
            SWAGGER_ENABLED=${SWAGGER_ENABLED}
            EOF
            docker pull "${IMAGE_REF}"
            export APP_IMAGE="${IMAGE_REF}"
            docker compose --env-file "${REMOTE_ENV_FILE}" -f "${{ secrets.TEST_DOCKER_COMPOSE_PATH }}" up -d --pull always

      - name: Testing health check
        if: ${{ secrets.TEST_HEALTHCHECK_URL != '' }}
        run: |
          curl --fail --show-error --silent "${{ secrets.TEST_HEALTHCHECK_URL }}"
