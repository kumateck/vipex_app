name: Desktop Release (Windows + macOS) (Push to desktop)

on:
  push:
    branches:
      - desktop

permissions:
  contents: read

env:
  DESKTOP_RELEASE_VERSION: 0.1.${{ github.run_number }}

jobs:
  build-windows-desktop:
    name: Build Windows Desktop Artifact
    runs-on: windows-latest
    env:
      ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore Electron Builder Cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ELECTRON_BUILDER_CACHE }}
          key: electron-builder-${{ runner.os }}-${{ hashFiles('bun.lock', 'apps/desktop/package.json') }}
          restore-keys: |
            electron-builder-${{ runner.os }}-

      - name: Install Dependencies
        run: bun install

      - name: Sync Brand Assets
        run: bun run assets:sync

      - name: Apply Desktop Release Version
        run: |
          node -e "const fs=require('node:fs');const file='apps/desktop/package.json';const pkg=JSON.parse(fs.readFileSync(file,'utf8'));pkg.version=process.env.DESKTOP_RELEASE_VERSION;fs.writeFileSync(file,JSON.stringify(pkg,null,2)+'\\n')"

      - name: Build Windows Desktop Release (NSIS)
        env:
          DESKTOP_WEB_BASE_URL: https://testing.app.vipexparcel.com/
          DESKTOP_UPDATE_FEED_URL: https://testing.app.vipexparcel.com/v1/desktop-updates/windows/latest/
        run: |
          for attempt in 1 2 3; do
            echo "Windows NSIS build attempt ${attempt} of 3"
            if bun run --cwd apps/desktop make:windows; then
              exit 0
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "Windows NSIS build failed after 3 attempts"
              exit 1
            fi
            delay=$((attempt * 15))
            echo "Build download failed; retrying in ${delay} seconds"
            sleep "${delay}"
          done

      - name: Resolve Desktop Version
        id: desktop_version
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload Windows Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vipex-desktop-windows-${{ github.event.pull_request.number || github.run_number }}
          path: apps/desktop/out/make/**
          if-no-files-found: error
          retention-days: 14

  build-macos-desktop:
    name: Build macOS Desktop Artifact
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    env:
      DEPLOY_MINIO_ENDPOINT: ${{ secrets.DEPLOY_MINIO_ENDPOINT }}
      MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
      MINIO_REGION: ${{ secrets.MINIO_REGION }}
      MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
      MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
      MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
      DESKTOP_MINIO_PREFIX: desktop/macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Sync Brand Assets
        run: bun run assets:sync

      - name: Apply Desktop Release Version
        run: |
          node -e "const fs=require('node:fs');const file='apps/desktop/package.json';const pkg=JSON.parse(fs.readFileSync(file,'utf8'));pkg.version=process.env.DESKTOP_RELEASE_VERSION;fs.writeFileSync(file,JSON.stringify(pkg,null,2)+'\\n')"

      - name: Build macOS Desktop Release (ZIP)
        env:
          DESKTOP_WEB_BASE_URL: https://testing.app.vipexparcel.com/
          DESKTOP_UPDATE_FEED_URL: https://testing.app.vipexparcel.com/v1/desktop-updates/macos/latest/
        run: bun run --cwd apps/desktop make -- --targets @electron-forge/maker-zip

      - name: Resolve Desktop Version
        id: desktop_version
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate macOS electron-updater metadata
        env:
          VERSION: ${{ steps.desktop_version.outputs.version }}
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');

          const root = 'apps/desktop/out/make';
          const zipFiles = [];
          const visit = (directory) => {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const fullPath = path.join(directory, entry.name);
              if (entry.isDirectory()) visit(fullPath);
              else if (entry.name.toLowerCase().endsWith('.zip')) zipFiles.push(fullPath);
            }
          };
          visit(root);

          if (zipFiles.length !== 1) {
            console.error(`Expected one macOS ZIP under ${root}, found ${zipFiles.length}`);
            process.exit(1);
          }

          const zipPath = zipFiles[0];
          const releaseDir = path.dirname(zipPath);
          const zipFile = path.basename(zipPath);
          const zipBuffer = fs.readFileSync(zipPath);
          const sha512 = crypto.createHash('sha512').update(zipBuffer).digest('base64');
          const yaml = [
            `version: ${process.env.VERSION}`,
            'files:',
            `  - url: ${zipFile}`,
            `    sha512: ${sha512}`,
            `    size: ${zipBuffer.length}`,
            `path: ${zipFile}`,
            `sha512: ${sha512}`,
            `releaseDate: '${new Date().toISOString()}'`,
            '',
          ].join('\n');

          fs.writeFileSync(path.join(releaseDir, 'latest-mac.yml'), yaml);
          console.log(`Generated latest-mac.yml for ${zipFile}`);
          NODE

      - name: Upload macOS Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vipex-desktop-macos-${{ github.event.pull_request.number || github.run_number }}
          path: apps/desktop/out/make/**
          if-no-files-found: error
          retention-days: 14

      - name: Configure AWS CLI for MinIO
        if: ${{ (env.DEPLOY_MINIO_ENDPOINT != '' || env.MINIO_ENDPOINT != '') && env.MINIO_ACCESS_KEY != '' && env.MINIO_SECRET_KEY != '' && env.MINIO_BUCKET != '' }}
        run: |
          mkdir -p ~/.aws
          cat <<EOF > ~/.aws/credentials
          [default]
          aws_access_key_id=${MINIO_ACCESS_KEY}
          aws_secret_access_key=${MINIO_SECRET_KEY}
          EOF
          cat <<EOF > ~/.aws/config
          [default]
          region=${MINIO_REGION:-us-east-1}
          output=json
          EOF

      - name: Mirror macOS build to MinIO (optional)
        if: ${{ (env.DEPLOY_MINIO_ENDPOINT != '' || env.MINIO_ENDPOINT != '') && env.MINIO_ACCESS_KEY != '' && env.MINIO_SECRET_KEY != '' && env.MINIO_BUCKET != '' }}
        env:
          VERSION: ${{ steps.desktop_version.outputs.version }}
        run: |
          set -euo pipefail
          UPLOAD_MINIO_ENDPOINT="${DEPLOY_MINIO_ENDPOINT:-${MINIO_ENDPOINT}}"
          PREFIX="${DESKTOP_MINIO_PREFIX:-desktop/macos}"
          LATEST_PREFIX="${PREFIX}/latest"
          VERSION_PREFIX="${PREFIX}/v${VERSION}"

          FILES=$(find apps/desktop/out/make -type f \( -name "*.zip" -o -name "*.dmg" -o -name "*.yml" -o -name "*.blockmap" \) || true)
          if [ -z "${FILES}" ]; then
            echo "No macOS distributables found under apps/desktop/out/make"
            exit 1
          fi

          while IFS= read -r file; do
            [ -z "${file}" ] && continue
            base=$(basename "${file}")
            aws --endpoint-url "${UPLOAD_MINIO_ENDPOINT}" s3api put-object \
              --bucket "${MINIO_BUCKET}" \
              --key "${LATEST_PREFIX}/${base}" \
              --body "${file}" >/dev/null

            aws --endpoint-url "${UPLOAD_MINIO_ENDPOINT}" s3api put-object \
              --bucket "${MINIO_BUCKET}" \
              --key "${VERSION_PREFIX}/${base}" \
              --body "${file}" >/dev/null
          done <<EOF
          ${FILES}
          EOF

      - name: Distribution summary
        run: |
          echo "macOS artifact uploaded to GitHub Actions artifacts."
          if [ -n "${DEPLOY_MINIO_ENDPOINT:-${MINIO_ENDPOINT}}" ] && [ -n "${MINIO_BUCKET}" ]; then
            PREFIX="${DESKTOP_MINIO_PREFIX:-desktop/macos}"
            UPLOAD_MINIO_ENDPOINT="${DEPLOY_MINIO_ENDPOINT:-${MINIO_ENDPOINT}}"
            echo "MinIO mirror base: ${UPLOAD_MINIO_ENDPOINT%/}/${MINIO_BUCKET}/${PREFIX}/"
          fi

  publish-windows-feed:
    name: Publish Windows Feed to MinIO
    needs: build-windows-desktop
    runs-on: ubuntu-latest
    env:
      DEPLOY_MINIO_ENDPOINT: ${{ secrets.DEPLOY_MINIO_ENDPOINT }}
      MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
      MINIO_REGION: ${{ secrets.MINIO_REGION }}
      MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
      MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
      MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
      DESKTOP_MINIO_PREFIX: desktop/windows
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate MinIO secrets
        run: |
          set -euo pipefail
          UPLOAD_MINIO_ENDPOINT="${DEPLOY_MINIO_ENDPOINT:-${MINIO_ENDPOINT}}"
          : "${UPLOAD_MINIO_ENDPOINT:?DEPLOY_MINIO_ENDPOINT (or MINIO_ENDPOINT fallback) secret is required}"
          : "${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY secret is required}"
          : "${MINIO_SECRET_KEY:?MINIO_SECRET_KEY secret is required}"
          : "${MINIO_BUCKET:?MINIO_BUCKET secret is required}"

      - name: Resolve Desktop Version
        id: desktop_version
        run: |
          VERSION="${DESKTOP_RELEASE_VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: vipex-desktop-windows-${{ github.event.pull_request.number || github.run_number }}
          path: .tmp/desktop-make

      - name: Locate NSIS update feed
        id: find_output
        run: |
          set -euo pipefail
          ROOT=".tmp/desktop-make"
          METADATA_FILE=$(find "$ROOT" -type f -name "latest.yml" | head -n 1 || true)
          if [ -z "$METADATA_FILE" ]; then
            echo "electron-builder latest.yml not found in downloaded artifact"
            find "$ROOT" -maxdepth 5 -type f | sed -n '1,200p'
            exit 1
          fi
          RELEASE_DIR=$(dirname "$METADATA_FILE")
          echo "release_dir=$RELEASE_DIR" >> "$GITHUB_OUTPUT"
          ls -lah "$RELEASE_DIR"

      - name: Configure AWS CLI for MinIO
        run: |
          mkdir -p ~/.aws
          cat <<EOF > ~/.aws/credentials
          [default]
          aws_access_key_id=${MINIO_ACCESS_KEY}
          aws_secret_access_key=${MINIO_SECRET_KEY}
          EOF
          cat <<EOF > ~/.aws/config
          [default]
          region=${MINIO_REGION:-us-east-1}
          output=json
          EOF

      - name: Publish latest feed
        env:
          RELEASE_DIR: ${{ steps.find_output.outputs.release_dir }}
          VERSION: ${{ steps.desktop_version.outputs.version }}
        run: |
          set -euo pipefail
          UPLOAD_MINIO_ENDPOINT="${DEPLOY_MINIO_ENDPOINT:-${MINIO_ENDPOINT}}"
          PREFIX="${DESKTOP_MINIO_PREFIX:-desktop/windows}"
          LATEST_PREFIX="${PREFIX}/latest"
          VERSION_PREFIX="${PREFIX}/v${VERSION}"

          echo "Publishing to:"
          echo "  s3://${MINIO_BUCKET}/${LATEST_PREFIX}/"
          echo "  s3://${MINIO_BUCKET}/${VERSION_PREFIX}/"

          mapfile -t FILES < <(find "${RELEASE_DIR}" -maxdepth 1 -type f)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No release files found in ${RELEASE_DIR}"
            exit 1
          fi

          # Upload each file with s3api put-object (single PUT) to avoid multipart checksum
          # compatibility issues seen with some MinIO setups.
          for file in "${FILES[@]}"; do
            base=$(basename "${file}")
            aws --endpoint-url "${UPLOAD_MINIO_ENDPOINT}" s3api put-object \
              --bucket "${MINIO_BUCKET}" \
              --key "${LATEST_PREFIX}/${base}" \
              --body "${file}" >/dev/null

            aws --endpoint-url "${UPLOAD_MINIO_ENDPOINT}" s3api put-object \
              --bucket "${MINIO_BUCKET}" \
              --key "${VERSION_PREFIX}/${base}" \
              --body "${file}" >/dev/null
          done

      - name: Feed URL hint
        run: |
          echo "Windows feed: https://testing.app.vipexparcel.com/v1/desktop-updates/windows/latest/"
          echo "macOS feed: https://testing.app.vipexparcel.com/v1/desktop-updates/macos/latest/"
