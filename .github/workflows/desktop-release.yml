name: Desktop Release (Windows + macOS) (PR to desktop)

on:
  pull_request:
    branches:
      - desktop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-desktop:
    name: Build Windows Desktop Artifact
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Sync Brand Assets
        run: bun run assets:sync

      - name: Build Windows Desktop Release (Squirrel)
        run: bun run --cwd apps/desktop make -- --targets @electron-forge/maker-squirrel

      - name: Resolve Desktop Version
        id: desktop_version
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload Windows Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vipex-desktop-windows-${{ github.event.pull_request.number || github.run_number }}
          path: apps/desktop/out/make/**
          if-no-files-found: error
          retention-days: 14

  build-macos-desktop:
    name: Build macOS Desktop Artifact
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    env:
      MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
      MINIO_REGION: ${{ secrets.MINIO_REGION }}
      MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
      MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
      MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
      DESKTOP_MINIO_PREFIX: desktop/macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Sync Brand Assets
        run: bun run assets:sync

      - name: Build macOS Desktop Release (ZIP)
        run: bun run --cwd apps/desktop make -- --targets @electron-forge/maker-zip

      - name: Resolve Desktop Version
        id: desktop_version
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload macOS Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vipex-desktop-macos-${{ github.event.pull_request.number || github.run_number }}
          path: apps/desktop/out/make/**
          if-no-files-found: error
          retention-days: 14

      - name: Configure AWS CLI for MinIO
        if: ${{ env.MINIO_ENDPOINT != '' && env.MINIO_ACCESS_KEY != '' && env.MINIO_SECRET_KEY != '' && env.MINIO_BUCKET != '' }}
        run: |
          mkdir -p ~/.aws
          cat <<EOF > ~/.aws/credentials
          [default]
          aws_access_key_id=${MINIO_ACCESS_KEY}
          aws_secret_access_key=${MINIO_SECRET_KEY}
          EOF
          cat <<EOF > ~/.aws/config
          [default]
          region=${MINIO_REGION:-us-east-1}
          output=json
          EOF

      - name: Mirror macOS build to MinIO (optional)
        if: ${{ env.MINIO_ENDPOINT != '' && env.MINIO_ACCESS_KEY != '' && env.MINIO_SECRET_KEY != '' && env.MINIO_BUCKET != '' }}
        env:
          VERSION: ${{ steps.desktop_version.outputs.version }}
        run: |
          set -euo pipefail
          PREFIX="${DESKTOP_MINIO_PREFIX:-desktop/macos}"
          LATEST_PREFIX="${PREFIX}/latest"
          VERSION_PREFIX="${PREFIX}/v${VERSION}"

          FILES=$(find apps/desktop/out/make -type f \( -name "*.zip" -o -name "*.dmg" \) || true)
          if [ -z "${FILES}" ]; then
            echo "No macOS distributables found under apps/desktop/out/make"
            exit 1
          fi

          while IFS= read -r file; do
            [ -z "${file}" ] && continue
            base=$(basename "${file}")
            aws --endpoint-url "${MINIO_ENDPOINT}" s3api put-object \
              --bucket "${MINIO_BUCKET}" \
              --key "${LATEST_PREFIX}/${base}" \
              --body "${file}" >/dev/null

            aws --endpoint-url "${MINIO_ENDPOINT}" s3api put-object \
              --bucket "${MINIO_BUCKET}" \
              --key "${VERSION_PREFIX}/${base}" \
              --body "${file}" >/dev/null
          done <<EOF
          ${FILES}
          EOF

      - name: Distribution summary
        run: |
          echo "macOS artifact uploaded to GitHub Actions artifacts."
          if [ -n "${MINIO_ENDPOINT}" ] && [ -n "${MINIO_BUCKET}" ]; then
            PREFIX="${DESKTOP_MINIO_PREFIX:-desktop/macos}"
            echo "MinIO mirror base: ${MINIO_ENDPOINT%/}/${MINIO_BUCKET}/${PREFIX}/"
          fi

  publish-windows-feed:
    name: Publish Windows Feed to MinIO
    needs: build-windows-desktop
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    env:
      MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
      MINIO_REGION: ${{ secrets.MINIO_REGION }}
      MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
      MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
      MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
      DESKTOP_MINIO_PREFIX: desktop/windows
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate MinIO secrets
        run: |
          set -euo pipefail
          : "${MINIO_ENDPOINT:?MINIO_ENDPOINT secret is required}"
          : "${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY secret is required}"
          : "${MINIO_SECRET_KEY:?MINIO_SECRET_KEY secret is required}"
          : "${MINIO_BUCKET:?MINIO_BUCKET secret is required}"

      - name: Resolve Desktop Version
        id: desktop_version
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: vipex-desktop-windows-${{ github.event.pull_request.number || github.run_number }}
          path: .tmp/desktop-make

      - name: Locate Squirrel output
        id: find_output
        run: |
          set -euo pipefail
          ROOT=".tmp/desktop-make"
          RELEASE_FILE=$(find "$ROOT" -type f -name "RELEASES" | head -n 1 || true)
          if [ -z "$RELEASE_FILE" ]; then
            echo "RELEASES file not found in downloaded artifact"
            find "$ROOT" -maxdepth 5 -type f | sed -n '1,200p'
            exit 1
          fi
          RELEASE_DIR=$(dirname "$RELEASE_FILE")
          echo "release_dir=$RELEASE_DIR" >> "$GITHUB_OUTPUT"
          ls -lah "$RELEASE_DIR"

      - name: Configure AWS CLI for MinIO
        run: |
          mkdir -p ~/.aws
          cat <<EOF > ~/.aws/credentials
          [default]
          aws_access_key_id=${MINIO_ACCESS_KEY}
          aws_secret_access_key=${MINIO_SECRET_KEY}
          EOF
          cat <<EOF > ~/.aws/config
          [default]
          region=${MINIO_REGION:-us-east-1}
          output=json
          EOF

      - name: Publish latest feed
        env:
          RELEASE_DIR: ${{ steps.find_output.outputs.release_dir }}
          VERSION: ${{ steps.desktop_version.outputs.version }}
        run: |
          set -euo pipefail
          PREFIX="${DESKTOP_MINIO_PREFIX:-desktop/windows}"
          LATEST_PREFIX="${PREFIX}/latest"
          VERSION_PREFIX="${PREFIX}/v${VERSION}"

          echo "Publishing to:"
          echo "  s3://${MINIO_BUCKET}/${LATEST_PREFIX}/"
          echo "  s3://${MINIO_BUCKET}/${VERSION_PREFIX}/"

          mapfile -t FILES < <(find "${RELEASE_DIR}" -maxdepth 1 -type f)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No release files found in ${RELEASE_DIR}"
            exit 1
          fi

          # Upload each file with s3api put-object (single PUT) to avoid multipart checksum
          # compatibility issues seen with some MinIO setups.
          for file in "${FILES[@]}"; do
            base=$(basename "${file}")
            aws --endpoint-url "${MINIO_ENDPOINT}" s3api put-object \
              --bucket "${MINIO_BUCKET}" \
              --key "${LATEST_PREFIX}/${base}" \
              --body "${file}" >/dev/null

            aws --endpoint-url "${MINIO_ENDPOINT}" s3api put-object \
              --bucket "${MINIO_BUCKET}" \
              --key "${VERSION_PREFIX}/${base}" \
              --body "${file}" >/dev/null
          done

      - name: Feed URL hint
        run: |
          PREFIX="${DESKTOP_MINIO_PREFIX:-desktop/windows}"
          echo "Set DESKTOP_UPDATE_FEED_URL in desktop runtime to:"
          echo "${MINIO_ENDPOINT%/}/${MINIO_BUCKET}/${PREFIX}/latest/"
