name: Deploy Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate:
    name: Final Sanity Checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      NODE_ENV: production
      APP_BASE_URL: ${{ secrets.PROD_APP_BASE_URL }}
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      EMAIL_PASSWORD: ${{ secrets.PROD_EMAIL_PASSWORD }}
      EMAIL_USER: ${{ secrets.PROD_EMAIL_USER }}
      JWT_ACCESS_EXPIRES: ${{ secrets.PROD_JWT_ACCESS_EXPIRES }}
      JWT_REFRESH_EXPIRES: ${{ secrets.PROD_JWT_REFRESH_EXPIRES }}
      JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
      MINIO_REGION: ${{ secrets.PROD_MINIO_REGION }}
      PASSWORD_COST: ${{ secrets.PROD_PASSWORD_COST }}
      PORT: ${{ secrets.PROD_PORT }}
      SENTRY_DSN: ${{ secrets.PROD_SENTRY_DSN }}
      SMTP_FROM: ${{ secrets.PROD_SMTP_FROM }}
      SMTP_HOST: ${{ secrets.PROD_SMTP_HOST }}
      SMTP_PASS: ${{ secrets.PROD_SMTP_PASS }}
      SMTP_PORT: ${{ secrets.PROD_SMTP_PORT }}
      SMTP_SECURE: ${{ secrets.PROD_SMTP_SECURE }}
      SMTP_USER: ${{ secrets.PROD_SMTP_USER }}
      SWAGGER_ENABLED: ${{ secrets.PROD_SWAGGER_ENABLED }}

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint
        run: bun run lint

      - name: Run unit tests
        run: bun run test:ci

      - name: Run integration tests
        run: bun run test:server

      - name: Build optimized production app
        run: bun run build

  build-and-push:
    name: Build and Push Versioned Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate
    environment: production
    env:
      NODE_ENV: production
      APP_BASE_URL: ${{ secrets.PROD_APP_BASE_URL }}
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      EMAIL_PASSWORD: ${{ secrets.PROD_EMAIL_PASSWORD }}
      EMAIL_USER: ${{ secrets.PROD_EMAIL_USER }}
      JWT_ACCESS_EXPIRES: ${{ secrets.PROD_JWT_ACCESS_EXPIRES }}
      JWT_REFRESH_EXPIRES: ${{ secrets.PROD_JWT_REFRESH_EXPIRES }}
      JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
      MINIO_REGION: ${{ secrets.PROD_MINIO_REGION }}
      PASSWORD_COST: ${{ secrets.PROD_PASSWORD_COST }}
      PORT: ${{ secrets.PROD_PORT }}
      SENTRY_DSN: ${{ secrets.PROD_SENTRY_DSN }}
      SMTP_FROM: ${{ secrets.PROD_SMTP_FROM }}
      SMTP_HOST: ${{ secrets.PROD_SMTP_HOST }}
      SMTP_PASS: ${{ secrets.PROD_SMTP_PASS }}
      SMTP_PORT: ${{ secrets.PROD_SMTP_PORT }}
      SMTP_SECURE: ${{ secrets.PROD_SMTP_SECURE }}
      SMTP_USER: ${{ secrets.PROD_SMTP_USER }}
      SWAGGER_ENABLED: ${{ secrets.PROD_SWAGGER_ENABLED }}
    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}
      version_tag: ${{ steps.version.outputs.version_tag }}

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4

      - name: Read release tag
        id: version
        run: |
          VERSION_TAG="${GITHUB_REF_NAME}"
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "Preparing release image for ${VERSION_TAG}"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.PROD_REGISTRY }}
          username: ${{ secrets.PROD_REGISTRY_USERNAME }}
          password: ${{ secrets.PROD_REGISTRY_PASSWORD }}

      - name: Compose image reference
        id: image
        run: |
          IMAGE_REF="${{ secrets.PROD_REGISTRY }}/${{ secrets.PROD_IMAGE_NAME }}:${{ steps.version.outputs.version_tag }}"
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${IMAGE_REF}"

      - name: Build and push release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image.outputs.image_ref }}

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-and-push
    environment: production
    env:
      NODE_ENV: production
      RELEASE: ${{ needs.build-and-push.outputs.version_tag }}
      APP_BASE_URL: ${{ secrets.PROD_APP_BASE_URL }}
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      EMAIL_PASSWORD: ${{ secrets.PROD_EMAIL_PASSWORD }}
      EMAIL_USER: ${{ secrets.PROD_EMAIL_USER }}
      JWT_ACCESS_EXPIRES: ${{ secrets.PROD_JWT_ACCESS_EXPIRES }}
      JWT_REFRESH_EXPIRES: ${{ secrets.PROD_JWT_REFRESH_EXPIRES }}
      JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
      MINIO_REGION: ${{ secrets.PROD_MINIO_REGION }}
      PASSWORD_COST: ${{ secrets.PROD_PASSWORD_COST }}
      PORT: ${{ secrets.PROD_PORT }}
      SENTRY_DSN: ${{ secrets.PROD_SENTRY_DSN }}
      SMTP_FROM: ${{ secrets.PROD_SMTP_FROM }}
      SMTP_HOST: ${{ secrets.PROD_SMTP_HOST }}
      SMTP_PASS: ${{ secrets.PROD_SMTP_PASS }}
      SMTP_PORT: ${{ secrets.PROD_SMTP_PORT }}
      SMTP_SECURE: ${{ secrets.PROD_SMTP_SECURE }}
      SMTP_USER: ${{ secrets.PROD_SMTP_USER }}
      SWAGGER_ENABLED: ${{ secrets.PROD_SWAGGER_ENABLED }}

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          script_stop: true
          envs: NODE_ENV,RELEASE,APP_BASE_URL,DATABASE_URL,EMAIL_PASSWORD,EMAIL_USER,JWT_ACCESS_EXPIRES,JWT_REFRESH_EXPIRES,JWT_SECRET,MINIO_REGION,PASSWORD_COST,PORT,SENTRY_DSN,SMTP_FROM,SMTP_HOST,SMTP_PASS,SMTP_PORT,SMTP_SECURE,SMTP_USER,SWAGGER_ENABLED
          script: |
            set -euo pipefail
            IMAGE_REF="${{ needs.build-and-push.outputs.image_ref }}"
            REMOTE_ENV_FILE="/tmp/vipex-production.env"
            cat > "${REMOTE_ENV_FILE}" <<EOF
            NODE_ENV=${NODE_ENV}
            RELEASE=${RELEASE}
            APP_BASE_URL=${APP_BASE_URL}
            DATABASE_URL=${DATABASE_URL}
            EMAIL_PASSWORD=${EMAIL_PASSWORD}
            EMAIL_USER=${EMAIL_USER}
            JWT_ACCESS_EXPIRES=${JWT_ACCESS_EXPIRES}
            JWT_REFRESH_EXPIRES=${JWT_REFRESH_EXPIRES}
            JWT_SECRET=${JWT_SECRET}
            MINIO_REGION=${MINIO_REGION}
            PASSWORD_COST=${PASSWORD_COST}
            PORT=${PORT}
            SENTRY_DSN=${SENTRY_DSN}
            SMTP_FROM=${SMTP_FROM}
            SMTP_HOST=${SMTP_HOST}
            SMTP_PASS=${SMTP_PASS}
            SMTP_PORT=${SMTP_PORT}
            SMTP_SECURE=${SMTP_SECURE}
            SMTP_USER=${SMTP_USER}
            SWAGGER_ENABLED=${SWAGGER_ENABLED}
            EOF
            docker pull "${IMAGE_REF}"
            export APP_IMAGE="${IMAGE_REF}"
            docker compose --env-file "${REMOTE_ENV_FILE}" -f "${{ secrets.PROD_DOCKER_COMPOSE_PATH }}" up -d --pull always

      - name: Production health check
        if: ${{ secrets.PROD_HEALTHCHECK_URL != '' }}
        run: |
          curl --fail --show-error --silent "${{ secrets.PROD_HEALTHCHECK_URL }}"
