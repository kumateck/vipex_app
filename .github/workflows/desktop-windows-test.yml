name: Desktop Windows Test Build

on:
  workflow_dispatch:
    inputs:
      desktop_web_base_url:
        description: Hosted web app URL for the packaged test shell.
        required: true
        default: https://testing.app.vipexparcel.com/
      desktop_update_feed_url:
        description: Windows test update feed URL.
        required: true
        default: https://testing.app.vipexparcel.com/v1/desktop-updates/windows/latest/

permissions:
  contents: read

jobs:
  build-windows-test:
    name: Build Windows Test Installer
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      DESKTOP_WEB_BASE_URL: ${{ inputs.desktop_web_base_url }}
      DESKTOP_UPDATE_FEED_URL: ${{ inputs.desktop_update_feed_url }}
      ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore Electron Builder Cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ELECTRON_BUILDER_CACHE }}
          key: electron-builder-${{ runner.os }}-${{ hashFiles('bun.lock', 'apps/desktop/package.json') }}
          restore-keys: |
            electron-builder-${{ runner.os }}-

      - name: Install Dependencies
        run: bun install

      - name: Sync Brand Assets
        run: bun run assets:sync

      - name: Typecheck Desktop Shell
        run: bunx tsc -p apps/desktop/tsconfig.json --noEmit

      - name: Build Windows Test Installer
        run: |
          for attempt in 1 2 3; do
            echo "Windows test NSIS build attempt ${attempt} of 3"
            if bun run --cwd apps/desktop make:windows:test; then
              exit 0
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "Windows test NSIS build failed after 3 attempts"
              exit 1
            fi
            delay=$((attempt * 15))
            echo "Build download failed; retrying in ${delay} seconds"
            sleep "${delay}"
          done

      - name: Upload Windows Test Installer
        uses: actions/upload-artifact@v4
        with:
          name: vipex-desktop-windows-test-${{ github.run_number }}
          path: apps/desktop/out/make/**
          if-no-files-found: error
          retention-days: 14
