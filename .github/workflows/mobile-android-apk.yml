name: Mobile Android APK (Internal)

on:
  pull_request:
    branches:
      - mobile
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Verify Expo Token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is missing. Add it in GitHub repo secrets."
            exit 1
          fi

      - name: Trigger and Wait for EAS Android APK Build
        id: eas_build
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          bunx eas-cli whoami
          bunx eas-cli build --platform android --profile preview --non-interactive --wait --json > eas-build.json
          cat eas-build.json

          APK_URL=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('eas-build.json','utf8'));const item=Array.isArray(j)?j[0]:j;console.log(item?.artifacts?.buildUrl||'')")
          BUILD_ID=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('eas-build.json','utf8'));const item=Array.isArray(j)?j[0]:j;console.log(item?.id||'')")

          if [ -z "$APK_URL" ]; then
            echo "Could not resolve APK URL from EAS output"
            exit 1
          fi

          echo "apk_url=$APK_URL" >> "$GITHUB_OUTPUT"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Download APK
        run: |
          mkdir -p artifacts
          curl -L "${{ steps.eas_build.outputs.apk_url }}" -o artifacts/vipex-mobile-${{ github.run_number }}.apk
          ls -lah artifacts

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vipex-mobile-android-apk-${{ github.event.pull_request.number || github.run_number }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
