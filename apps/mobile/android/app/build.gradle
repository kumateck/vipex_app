apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

project.ext.vectoricons = [
    iconFontsDir: "../../../../node_modules/react-native-vector-icons/Fonts",
    iconFontNames: ["Ionicons.ttf"]
]

apply from: file("../../../../node_modules/react-native-vector-icons/fonts.gradle")

project.ext.envConfigFiles = [
    debug: ".env",
    debugoptimized: ".env",
    release: ".env.production"
]
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

def isReleaseBuildRequested = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase().contains("release")
}

if (isReleaseBuildRequested) {
    def releaseApiBaseUrl = project.env.get("API_BASE_URL")?.trim()
    def forbiddenReleaseHosts = ["localhost", "127.0.0.1", "10.0.2.2"]
    def usesForbiddenReleaseHost = forbiddenReleaseHosts.any { host ->
        releaseApiBaseUrl?.contains(host)
    }

    if (!releaseApiBaseUrl?.startsWith("https://") || usesForbiddenReleaseHost) {
        throw new GradleException(
            "Release API_BASE_URL must be a non-local HTTPS URL; received: ${releaseApiBaseUrl ?: '(missing)'}"
        )
    }
}

react {
    entryFile = file("../../index.js")
    reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    cliFile = new File(["node", "--print", "require.resolve('react-native/cli.js')"].execute(null, rootDir).text.trim())
    hermesCommand = new File(["node", "--print", "require.resolve('hermes-compiler/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/hermesc/%OS-BIN%/hermesc"
    autolinkLibrariesWithApp()
}

def enableMinifyInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.vipex.mobile"
    defaultConfig {
        applicationId "com.vipex.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 18
        versionName "1.0.18"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Internal APK builds currently use the standard React Native debug key.
            signingConfig signingConfigs.debug
            minifyEnabled enableMinifyInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
