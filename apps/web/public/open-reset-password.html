<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Vipex Desktop</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      .card {
        width: min(560px, 92vw);
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 24px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 24px;
      }
      p {
        margin: 0 0 10px;
        line-height: 1.4;
      }
      .actions {
        display: flex;
        gap: 10px;
        margin-top: 16px;
      }
      button,
      a {
        display: inline-block;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 14px;
        text-decoration: none;
      }
      button {
        border: 1px solid #0f172a;
        background: #0f172a;
        color: #fff;
        cursor: pointer;
      }
      a {
        border: 1px solid #cbd5e1;
        color: #0f172a;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Opening Vipex Desktop</h1>
      <p>We are trying to open the desktop app for password reset.</p>
      <p>If it does not open, continue in your browser.</p>
      <div class="actions">
        <button id="open-app" type="button">Open Desktop App</button>
        <a id="continue-web" href="/">Continue in Browser</a>
      </div>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token') || '';
      const deepLink = `vipex://reset-password${token ? `?token=${encodeURIComponent(token)}` : ''}`;
      const webFallback = `${window.location.origin}/#/reset-password${token ? `?token=${encodeURIComponent(token)}` : ''}`;

      const webLink = document.getElementById('continue-web');
      if (webLink) webLink.href = webFallback;

      let handoffDetected = false;
      window.addEventListener('blur', () => {
        handoffDetected = true;
      });
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) handoffDetected = true;
      });

      const tryDesktop = () => {
        window.location.href = deepLink;
      };

      const openButton = document.getElementById('open-app');
      if (openButton) {
        openButton.addEventListener('click', () => {
          tryDesktop();
          setTimeout(() => {
            if (!handoffDetected) window.location.replace(webFallback);
          }, 1500);
        });
      }

      if (!token) {
        window.location.replace(webFallback);
      } else {
        tryDesktop();
        setTimeout(() => {
          if (!handoffDetected) window.location.replace(webFallback);
        }, 1500);
      }
    </script>
  </body>
</html>
